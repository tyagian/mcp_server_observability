global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "mcp-app"
    static_configs:
      - targets: ["mcp-app:8000"]
    scrape_interval: 5s
    metrics_path: "/metrics"

  - job_name: "mcp-tools"
    static_configs:
      - targets: ["mcp-app:8000"]
    metrics_path: "/metrics"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "mcp_.*"
        action: "keep"
